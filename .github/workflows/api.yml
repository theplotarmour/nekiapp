name: API foundation
on:
  push:
    branches: [main]
    paths: ['api/**', 'tools/spikes/postgres_runtime.py', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'tools/spikes/postgres_runtime.py', '.github/workflows/api.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install tooling and target PostgreSQL
        run: |
          python -m pip install uv==0.12.15
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python export_openapi.py --check
      - name: Unit and PostgreSQL 16 integration tests
        env:
          NEKI_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: uv run --locked pytest -q
